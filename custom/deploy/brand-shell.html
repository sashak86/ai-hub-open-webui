<!-- Sasha fork identity is additive: upstream Open WebUI name and logo remain visible. -->
<style id="sasha-fork-shell-style">
#splash-screen .sasha-fork-loading{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:min(300px,90vw);font:14px/1.4 system-ui;color:#333}html.dark #splash-screen .sasha-fork-loading{color:#eee}.sasha-fork-loading .sasha-fork-marks{display:flex;align-items:center;gap:18px;margin-bottom:3px}.sasha-fork-loading #logo{position:static!important;width:64px!important;height:64px!important;object-fit:contain;transform:none!important;border-radius:0;box-shadow:none}.sasha-fork-loading img{width:64px;height:64px;object-fit:cover;filter:grayscale(1);border-radius:50%;box-shadow:0 0 0 1px #8885}.sasha-fork-loading strong{font-size:20px;font-weight:600}.sasha-fork-loading small{opacity:.65;font-size:12px}
</style>
<script id="sasha-fork-shell-script">
(()=>{const splash=document.getElementById('splash-screen');if(!splash||splash.querySelector('.sasha-fork-loading'))return;const block=document.createElement('div');block.className='sasha-fork-loading';block.setAttribute('role','status');const avatar=document.createElement('img');avatar.src='/ai-hub/assets/sasha-avatar.png';avatar.alt='Sasha';const title=document.createElement('strong');title.textContent='Sasha · AI Workbench';const caption=document.createElement('span');caption.textContent='Форк Sasha · на базе Open WebUI';const progress=document.createElement('small');progress.textContent='Загружаем ваше рабочее пространство…';const marks=document.createElement('div');marks.className='sasha-fork-marks';marks.append(avatar);block.append(marks,title,caption,progress);splash.append(block);const joint=()=>{const original=document.getElementById('logo');if(original){original.alt='Open WebUI';marks.prepend(original)}};document.addEventListener('DOMContentLoaded',joint,{once:true});joint()})();
</script>
